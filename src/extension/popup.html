<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CogniGuard AI</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f2937;
      --blue: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --text: #f9fafb;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: var(--bg); color: var(--text); padding: 16px; user-select: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .status-badge { display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .pulse { width: 6px; height: 6px; background: var(--green); border-radius: 50%; box-shadow: 0 0 6px var(--green); }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; }
    .stat-val { font-size: 18px; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    
    /* Reverse Engineering Threat Card */
    .threat-card { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--red); border-radius: 8px; padding: 12px; margin-bottom: 12px; font-size: 12px; display: none; }
    .threat-card strong { color: var(--red); display: block; margin-bottom: 4px; font-size: 13px; }
    .target-highlight { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 4px 6px; border-radius: 4px; font-weight: 700; display: inline-block; margin: 4px 0; }
    
    .btn-shred { display: none; width: 100%; background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
    .btn-shred:hover { background: #b91c1c; }
    .btn-resume { display: none; width: 100%; background: #10b981; color: white; border: none; padding: 8px; border-radius: 6px; font-weight: 600; font-size: 11px; cursor: pointer; margin-bottom: 10px; }
    
    .btn-sim { width: 100%; background: #2563eb; color: white; border: none; padding: 9px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; margin-bottom: 8px; }
    .btn-sim:hover { background: #1d4ed8; }
    .footer { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 6px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" style="width: 28px; height: 28px; border-radius: 6px; object-fit: cover;" alt="CogniGuard">
      <span>CogniGuard AI</span>
    </div>
    <div class="status-badge" id="status-pill">
      <div class="pulse"></div>
      <span>STATUS: OK</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="scanned-count">0</div>
      <div class="stat-label">Downloads Scanned</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="blocked-count" style="color: var(--green);">0</div>
      <div class="stat-label">Threats Shredded</div>
    </div>
  </div>

  <!-- Real-Time AI Reverse Engineering Analysis -->
  <div class="threat-card" id="threat-box">
    <strong>🔍 Reverse Engineering Analysis:</strong>
    <div>Target: <span class="target-highlight" id="threat-target">Stealing Bank PIN & Passwords</span></div>
    <span id="threat-desc" style="color: #fca5a5; font-size: 11px; display: block; margin-top: 4px;">
      Malicious script attempting to extract financial credentials.
    </span>
  </div>

  <!-- 1-Click Action Buttons -->
  <button class="btn-shred" id="btn-shred">🗑️ Yes, Shred & Permanently Delete File</button>
  <button class="btn-resume" id="btn-resume">✅ Allow & Resume (I Trust This)</button>

  <button class="btn-sim" id="btn-test">⚡ Test AI Reverse-Engineering (Bank PIN Attack)</button>

  <div class="footer">
    CogniGuard Autonomous Defense v1.0.3
  </div>

  <script src="popup.js"></script>
</body>
</html>
