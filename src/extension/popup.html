<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CogniGuard AI</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f2937;
      --blue: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --text: #f9fafb;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 340px; background: var(--bg); color: var(--text); padding: 16px; user-select: none; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .logo-badge { background: linear-gradient(135deg, #2563eb, #1d4ed8); width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .status-badge { display: flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .pulse { width: 6px; height: 6px; background: var(--green); border-radius: 50%; box-shadow: 0 0 6px var(--green); }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
    .stat-val { font-size: 20px; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .threat-card { background: rgba(239, 68, 68, 0.1); border: 1px solid var(--red); border-radius: 8px; padding: 10px; margin-bottom: 14px; font-size: 12px; display: none; }
    .threat-card strong { color: var(--red); display: block; margin-bottom: 4px; }
    .threat-card span { color: #fca5a5; font-size: 11px; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; }
    .btn-sim { width: 100%; background: #dc2626; color: white; border: none; padding: 10px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; margin-bottom: 8px; transition: 0.2s; }
    .btn-sim:hover { background: #b91c1c; }
    .footer { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <img src="icons/icon48.png" style="width: 28px; height: 28px; border-radius: 6px; object-fit: cover;" alt="CogniGuard">
      <span>CogniGuard AI</span>
    </div>
    <div class="status-badge" id="status-pill">
      <div class="pulse"></div>
      <span>STATUS: OK</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-val" id="scanned-count">14</div>
      <div class="stat-label">Downloads Scanned</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="blocked-count" style="color: var(--green);">2</div>
      <div class="stat-label">Threats Blocked</div>
    </div>
  </div>

  <div class="threat-card" id="threat-box">
    <strong>🚨 Latest Intercepted Threat:</strong>
    <span id="threat-desc">Job_Offer_Contract.pdf.exe paused in cloud airlock.</span>
  </div>

  <div class="toggle-row">
    <span>Zero-Entry Download Shield</span>
    <span style="color: var(--green); font-weight: 600;">ACTIVE</span>
  </div>

  <div class="toggle-row">
    <span>Credential Vault Guard</span>
    <span style="color: var(--green); font-weight: 600;">LOCKED</span>
  </div>

  <button class="btn-sim" id="btn-test">⚡ Test Hacker Intrusion Intercept</button>

  <div class="footer">
    CogniGuard Autonomous Defense v1.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
