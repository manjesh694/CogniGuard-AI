name: "CogniGuard AI Repo & AI-Skill Scanner"
description: "Scan repositories and AI agent skills before install for credential stealers, AST obfuscation, and prompt injections."
branding:
  icon: "shield"
  color: "blue"

inputs:
  target:
    description: "Directory or public GitHub URL to scan"
    required: false
    default: "."
  strict:
    description: "Fail build on REVIEW_REQUIRED as well as DO_NOT_INSTALL"
    required: false
    default: "true"
  format:
    description: "Output format: text, json, or sarif"
    required: false
    default: "sarif"
  output-file:
    description: "Path to write JSON/SARIF report when format is json or sarif"
    required: false
    default: "cogniguard.sarif"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install CogniGuard AI CLI
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r "${{ github.action_path }}/requirements.txt"
        pip install --no-cache-dir --no-deps "${{ github.action_path }}"

    - name: Run CogniGuard Security Scan
      shell: bash
      run: |
        ARGS=("scan" "${{ inputs.target }}" "--format" "${{ inputs.format }}")
        if [ "${{ inputs.strict }}" = "true" ]; then
          ARGS+=("--strict")
        fi
        if [ "${{ inputs.format }}" = "text" ]; then
          cogniguard "${ARGS[@]}"
        else
          cogniguard "${ARGS[@]}" > "${{ inputs.output-file }}"
          cat "${{ inputs.output-file }}"
        fi
